version: '3.8'

services:
  vietvoice-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vietvoice-clone-worker
    ports:
      - "8000:8000"
    environment:
      - CLONE_ENGINE=f5-tts  # or xtts-v2
      - PORT=8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
